name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements*.txt
      - run: python -m pip install uv && python -m uv pip install --system -r packaging/requirements-dev.txt --override packaging/overrides.txt
      - run: python -m pytest -q
      - name: Build release archive
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Python python
      - name: Installer works from the release archive
        shell: pwsh
        run: |
          Expand-Archive dist/HandTrack-windows.zip $env:RUNNER_TEMP/rel
          & "$env:RUNNER_TEMP/rel/HandTrack/app/install.ps1" -Yes -NoLaunch -NoDriver -InstallDir "$env:RUNNER_TEMP/inst"
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          & "$env:RUNNER_TEMP/inst/uninstall.ps1" -All -InstallDir "$env:RUNNER_TEMP/inst"
      - uses: actions/upload-artifact@v4
        with:
          name: HandTrack-windows
          path: dist/HandTrack-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HandTrack-windows.zip
          generate_release_notes: true
